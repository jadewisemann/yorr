spring:
  application:
    name: yorr

  # === Database ===
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # === JPA ===
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-on-migrate는 스키마가 비어 있지 않은데 이력 테이블이 없을 때 baseline을 찍는데,
    # 기본 baseline-version이 1이라 V1이 "이미 적용됨"으로 간주돼 조용히 건너뛰어진다.
    # 첫 마이그레이션이 유실되는 경로라 0으로 낮춘다.
    baseline-version: 0

  # === Redis ===
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  # === Docker Compose Support ===
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

  # === DevTools ===
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace