spring:
  application:
    name: yorr

  # === Database ===
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # === JPA ===
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-on-migrate는 스키마가 비어 있지 않은데 이력 테이블이 없을 때 baseline을 찍는데,
    # 기본 baseline-version이 1이라 V1이 "이미 적용됨"으로 간주돼 조용히 건너뛰어진다.
    # 첫 마이그레이션이 유실되는 경로라 0으로 낮춘다.
    baseline-version: 0

  # === Redis ===
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

  # === Docker Compose Support ===
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

  # === DevTools ===
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

# === 소셜 로그인 ===
# 값이 없어도 애플리케이션은 뜬다. 로그인 엔드포인트를 호출할 때만 503으로 거절되므로,
# 로그인을 건드리지 않는 팀원은 환경변수 없이 그대로 개발하면 된다.
yorr:
  auth:
    # 로그인을 끝낸 사용자를 되돌려 보낼 프론트 주소. 카카오 콘솔에 등록하는 값이 아니다.
    frontend-redirect-uri: ${AUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      # 카카오 콘솔의 Redirect URI와 문자 하나까지 같아야 한다(다르면 KOE006).
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
# === CORS ===
# 브라우저에서 이 서버를 부를 수 있는 출처. REST와 WebSocket이 같은 값을 쓴다.
# 기본값은 운영 도메인만이다 — 환경변수를 깜빡해도 개발용 출처가 열리지 않아야 한다.
# 로컬 개발자는 .env의 CORS_ALLOWED_ORIGINS에 localhost를 덧붙인다.
yorr:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yorr.site}
