# 풀스택 E2E — 진짜 백엔드 앞에 진짜 프론트 빌드를 세우고 브라우저로 방 만들기·참가·
# 시작을 끝까지 둔다(frontend/e2e/real). 백엔드는 **Botkeep에 올라가는 번들 그대로**를
# 패널에 넣는 시작 명령 그대로 띄운다(deploy/botkeep/README.md) — 출하물을 시험한다.
#
# mock E2E는 프론트가 계약을 **자기 사본**(e2e/support/contract.ts)대로 쓰는지를,
# 백엔드 블랙박스 스위트는 서버가 **자기 테스트**대로 답하는지를 본다. 둘 다 같은
# 오해를 공유하면 초록이 된다 — 두 쪽 코드를 실제로 맞물려 보는 곳은 여기뿐이다.
# 와이어 계약의 정본이 프론트라는 규칙(backend/AGENTS.md)을 기계로 확인하는 자리다.

name: fullstack

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/fullstack.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/fullstack.yml
  workflow_dispatch: {}

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  real-e2e:
    name: 실제 백엔드 × 실제 프론트 (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # 운영과 같은 변수 이름이다(deploy/botkeep/README.md 「환경 변수」).
      SERVER_PORT: "8080"
      # 브라우저는 preview 서버(127.0.0.1:4306)의 프록시를 거치고, 프록시가 Origin을 떼므로
      # 이 목록은 실제로 쓰이지 않는다. 그래도 운영 기본값(yorr.site)이 새지 않게 좁힌다.
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4306

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 백엔드 번들
        working-directory: backend
        run: npm ci && npm run build:botkeep

      - name: 백엔드 기동 (readiness까지)
        working-directory: deploy/botkeep/out
        run: |
          start=$(node -p "require('./package.json').scripts.start")
          nohup $start > ../../../backend/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then
              echo "UP after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::백엔드가 60초 안에 UP이 되지 않았다"
          cat ../../../backend/backend.log
          exit 1

      - name: 프론트 준비
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # `test:e2e:real`은 상대 경로(`/api/v1`·`/ws/v1/game`)로 빌드하고, preview 서버가
      # VITE_BACKEND_ORIGIN으로 프록시한다 — 브라우저 입장에서는 운영과 같은 동일 출처다.
      - name: real E2E
        working-directory: frontend
        env:
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8080
        run: npm run test:e2e:real -- --project=mobile-chrome

      # 게이트웨이는 핸들러 밖으로 샌 예외를 로그로만 남기고 소켓을 살려 둔다 — 로그를 보지
      # 않으면 버그가 초록 뒤에 숨는다(TESTING.md 「새어 나온 예외 0건」).
      - name: 서버 로그에 새어 나온 예외가 없다
        if: always()
        working-directory: backend
        run: |
          if grep -q 'WS 메시지 처리 실패' backend.log; then
            echo "::error::핸들러 밖으로 샌 예외가 있다"
            grep -A3 'WS 메시지 처리 실패' backend.log | head -40
            exit 1
          fi
          echo "새어 나온 예외 0건"

      - name: 실패 보고서
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fullstack-e2e
          path: |
            backend/backend.log
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
