# 풀스택 E2E — 진짜 백엔드(`node dist/main.js`, MySQL·Redis 포함) 앞에 진짜 프론트
# 빌드를 세우고 브라우저로 방 만들기·참가·시작을 끝까지 둔다(frontend/e2e/real).
#
# mock E2E는 프론트가 계약을 **자기 사본**(e2e/support/contract.ts)대로 쓰는지를,
# 백엔드 블랙박스 스위트는 서버가 **자기 테스트**대로 답하는지를 본다. 둘 다 같은
# 오해를 공유하면 초록이 된다 — 두 쪽 코드를 실제로 맞물려 보는 곳은 여기뿐이다.
# 와이어 계약의 정본이 프론트라는 규칙(backend/AGENTS.md)을 기계로 확인하는 자리다.

name: fullstack

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/fullstack.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/fullstack.yml
  workflow_dispatch: {}

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  real-e2e:
    name: 실제 백엔드 × 실제 프론트 (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          # backend.yml과 같은 이유로 비밀번호를 두지 않는다 — 잡이 끝나면 사라진다.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: yorr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
          --health-start-period=90s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      # 운영과 같은 진입점·같은 변수 이름이다(operations.md 「환경변수」).
      SERVER_PORT: "8080"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: yorr
      DB_USERNAME: root
      DB_PASSWORD: ""
      # 브라우저는 preview 서버(127.0.0.1:4306)의 프록시를 거치고, 프록시가 Origin을 떼므로
      # 이 목록은 실제로 쓰이지 않는다. 그래도 운영 기본값(yorr.site)이 새지 않게 좁힌다.
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 백엔드 빌드
        working-directory: backend
        run: npm ci && npm run build

      # 빈 DB에서 시작한다 — 운영의 `docker compose run --rm migrate`와 같은 진입점이다.
      # 이게 빠지면 `verifyMigrations`가 밀린 마이그레이션을 보고 exit 1로 죽는다.
      - name: 마이그레이션
        working-directory: backend
        run: npm run migrate

      - name: 백엔드 기동 (readiness까지)
        working-directory: backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then
              echo "UP after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::백엔드가 60초 안에 UP이 되지 않았다"
          cat backend.log
          exit 1

      - name: 프론트 준비
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # `test:e2e:real`은 상대 경로(`/api/v1`·`/ws/v1/game`)로 빌드하고, preview 서버가
      # VITE_BACKEND_ORIGIN으로 프록시한다 — 브라우저 입장에서는 운영과 같은 동일 출처다.
      - name: real E2E
        working-directory: frontend
        env:
          VITE_BACKEND_ORIGIN: http://127.0.0.1:8080
        run: npm run test:e2e:real -- --project=mobile-chrome

      # 게이트웨이는 핸들러 밖으로 샌 예외를 로그로만 남기고 소켓을 살려 둔다 — 로그를 보지
      # 않으면 버그가 초록 뒤에 숨는다(TESTING.md 「새어 나온 예외 0건」).
      - name: 서버 로그에 새어 나온 예외가 없다
        if: always()
        working-directory: backend
        run: |
          if grep -q 'WS 메시지 처리 실패' backend.log; then
            echo "::error::핸들러 밖으로 샌 예외가 있다"
            grep -A3 'WS 메시지 처리 실패' backend.log | head -40
            exit 1
          fi
          echo "새어 나온 예외 0건"

      - name: 실패 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-e2e
          path: |
            backend/backend.log
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
