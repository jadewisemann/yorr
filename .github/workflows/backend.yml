# Node 백엔드 CI + 배포 이미지 빌드 — backend/docs/adr/0006-github-actions-ghcr-arm64-single-host.md
#
# 검사와 이미지가 **한 파일 두 잡**인 이유: 테스트가 초록이 아닌 커밋의 이미지가
# GHCR에 올라가면 안 된다. 워크플로를 두 개로 나누면 `needs:`로 그것을 강제할 수
# 없다(`workflow_run`은 별개 실행이라 상태 전파가 느슨하다).
#
# PR에서도 image 잡이 돈다 — push만 하지 않는다. Dockerfile이 깨진 것을 배포
# 시점이 아니라 리뷰 시점에 알기 위해서다.

name: backend

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml
  workflow_dispatch: {}

# 같은 브랜치의 이전 실행은 취소한다. 단 main은 취소하지 않는다 —
# 이미지 빌드가 중간에 잘리면 어떤 커밋이 배포 가능한지 알 수 없게 된다.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 1. 검사 ───────────────────────────────────────────────────────────────────
  verify:
    name: check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # MySQL 통합 테스트(45건)를 **처음으로 실제로 돌리는 자리다** — 지금까지
    # `MYSQL_TEST_URL`이 없어 전부 skip이었고 SQL 문법조차 검증된 적이 없다
    # (ADR-0005 / PLANS.md 상태 표). 여기서 처음 빨간불이 날 수 있다.
    #
    # 운영과 같은 8.0. 하네스는 테스트마다
    # `yorr_test_<random>` 스키마를 CREATE/DROP하므로 **root가 필요하다**
    # (backend/src/infra/__tests__/mysqlHarness.ts).
    services:
      mysql:
        image: mysql:8.0
        env:
          # 비밀번호를 두지 않는다. 이 인스턴스는 잡이 끝나면 사라지고 러너
          # 밖에서 닿을 수 없으므로 지킬 것이 없는데, 리터럴을 적으면 시크릿
          # 스캐너(GitGuardian)가 정당하게 잡는다 — "회전할 수 없는 가짜 자격"이
          # 저장소에 남는 것이 더 나쁘다.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
          --health-start-period=90s

    env:
      # ADR-0004 / ADR-0005: 통합 테스트가 "조용히 건너뛴 초록"이 되는 것을 막는
      # 스위치. 이 두 줄이 없으면 Redis·MySQL이 없는 러너에서 CI가 초록으로 거짓말한다.
      REDIS_TEST_REQUIRED: "1"
      MYSQL_TEST_URL: mysql://root@127.0.0.1:3306
      MYSQL_TEST_REQUIRED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: >=22.12
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ADR-0004의 기본 경로: 하네스가 **테스트 파일마다** redis-server를 유닉스
      # 소켓으로 띄운다. service container + REDIS_TEST_URL로 대신할 수도 있지만
      # 그러면 vitest의 병렬 파일들이 하나의 Redis에 FLUSHALL을 걸어 서로를 깬다.
      # 필요한 것은 데몬이 아니라 **바이너리**다.
      - name: redis-server 바이너리 설치 (ADR-0004)
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo timeout 120s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update
            sudo timeout 120s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends redis-server
          fi
          redis-server --version

      - run: npm ci

      # 아래 네 개는 backend/AGENTS.md 「검증 명령」과 같은 순서·같은 스크립트다.
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ── 2. 배포 설정·controller 검증 ─────────────────────────────────────────────
  # `docker compose config`는 데몬 없이 돈다. 필수 변수(`${VAR:?}`)와 보간 오류를
  # 배포 직전이 아니라 여기서 잡는다.
  #
  # controller 검증이 같은 잡에 있는 이유: `image` 잡이 이 잡을 기다리므로(Release
  # Ready 계약) 배포 로직이 깨진 커밋의 이미지도 발행되지 않는다. 지난번 자동화는
  # **한 번도 실행되지 않은 채 머지됐다** — 호스트 없이 검증할 수 있는 것은 전부
  # 여기서 검증한다.
  compose:
    name: deploy 설정·controller 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 배포 스크립트 문법
        working-directory: deploy
        run: |
          for script in converge apply.sh status.sh rollback.sh bootstrap.sh metrics.sh tests/*.sh tests/fake-docker; do
            bash -n "$script"
            echo "ok $script"
          done

      # PLAN.md §9의 실패 주입 표. git은 진짜, docker만 대역이다 —
      # `up --wait` 실패 · 인프라 장애 · 게임 진행 · 잠금 경합을 실제로 주입한다.
      - name: controller 실패 주입 (deploy/PLAN.md §9)
        run: deploy/tests/converge.test.sh

      - name: compose config
        working-directory: deploy
        run: |
          # 실제 값이 아니라 자리만 채운다 — 검증하는 것은 문법과 필수 변수 목록이다.
          cat > ci.env <<'EOF'
          SERVER_PORT=8080
          DB_NAME=yorr
          DB_USERNAME=yorr
          DB_PASSWORD=ci
          MYSQL_ROOT_PASSWORD=ci
          PUBLIC_HOST=api.example.test
          EOF
          BACKEND_ENV_FILE=./ci.env docker compose --env-file ci.env config --quiet
          rm -f ci.env

      # 계측 설정은 문법이 깨져도 배포를 막지 않는다(별도 프로젝트다) — 대신 아무
      # 신호도 나가지 않는 상태로 **조용히** 멈춘다. 그래서 여기서 잡는다.
      # 운영자가 호스트에서 부르는 것과 **같은 명령**을 쓴다: 이 잡이 통과했다는 것이
      # `metrics.sh check`가 그 호스트에서도 통과한다는 뜻이어야 한다.
      - name: 계측 설정 검증 (Alloy)
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          PUBLIC_HOST=example.test
          SERVER_PORT=8080
          GRAFANA_CLOUD_PROM_URL=https://example.invalid/api/prom/push
          GRAFANA_CLOUD_PROM_USER=0
          GRAFANA_CLOUD_LOKI_URL=https://example.invalid/loki/api/v1/push
          GRAFANA_CLOUD_LOKI_USER=0
          GRAFANA_CLOUD_TOKEN=ci
          EOF
          ./metrics.sh check

          # 음성 대조. `alloy validate`는 통과할 때 아무것도 찍지 않으므로, 위
          # 명령이 성공한 것과 **검증기가 아무 일도 하지 않은 것**을 출력만으로는
          # 구별할 수 없다. 깨진 설정을 거절하는지 확인해 그 구별을 만든다 —
          # 하지 않으면 이 단계는 초록을 내는 연극이 된다.
          cp alloy/config.alloy /tmp/good.alloy
          printf 'prometheus.scrape "broken" {\n' > alloy/config.alloy
          if ./metrics.sh check >/dev/null 2>&1; then
            cp /tmp/good.alloy alloy/config.alloy
            echo "!! alloy validate가 깨진 설정도 통과시킨다 — 이 검증은 무의미하다." >&2
            exit 1
          fi
          cp /tmp/good.alloy alloy/config.alloy
          echo "-- 음성 대조 통과: 검증기가 깨진 설정을 거절한다"

          rm -f .env

  # ── 3. linux/arm64 이미지 → GHCR ─────────────────────────────────────────────
  #
  # **GHCR publish = Release Ready.** 호스트는 별도의 manifest DB도 deployment
  # server도 보지 않고, "GHCR에 성공적으로 발행된 이미지"를 배포 가능한 릴리스의
  # 증거로 쓴다(deploy/PLAN.md D2). 그래서 이 잡이 도달했다는 사실 자체가 계약이며,
  # **검사 하나라도 통과하지 못한 커밋의 이미지는 여기 올라오면 안 된다.**
  #
  # `needs`가 `[verify]`뿐이면 verify 성공 + compose 실패 + 이미지 발행이 성립한다.
  # 그 조합은 정확히 배포를 깨뜨리는 조합이다: `compose.yaml`이 공개 주소·필수 변수의
  # 정본이므로(그 파일은 이미지가 아니라 호스트 체크아웃에서 읽힌다) 문법이 깨진
  # 커밋의 이미지가 "배포 가능"으로 표시된다.
  image:
    name: linux/arm64 이미지
    needs: [verify, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 러너는 x86이고 대상은 arm64다. **ARM 러너를 쓰지 않는 이유**(ADR-0006):
      # Dockerfile이 컴파일·의존성 설치를 전부 `--platform=$BUILDPLATFORM`에서
      # 끝내고 arm64 스테이지에는 `RUN`이 없다. 즉 arm64 명령이 실행되지 않으므로
      # 에뮬레이션 비용이 0이고, GitHub의 ARM 러너(비공개 저장소는 유료)도 필요 없다.
      #
      # QEMU를 그래도 설치하는 것은 보험이다 — 누군가 런타임 스테이지에 `RUN`을
      # 넣었을 때 "exec format error"라는 알기 어려운 실패 대신 그냥 느리게 성공한다.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 별도 PAT가 필요 없다 — 이 워크플로의 packages:write 권한으로 충분하다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          # `main`은 "지금 배포 가능한 것"(발견용), `sha-<커밋>`은 움직이지 않는
          # 불변 태그다. 호스트는 `:main`으로 발견하고 **digest로 고정해 실행한다**
          # (deploy/PLAN.md D3) — `:main`이 나중에 다른 이미지를 가리켜도 실행 중인
          # 릴리스가 변하지 않는다.
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # `metadata-action`의 기본 라벨에 `org.opencontainers.image.revision`이 있다.
      # 호스트 controller의 릴리스 발견이 **그 라벨 하나**에 달려 있으므로(이미지가
      # 곧 release marker다 — D2) 여기서 실제로 붙었는지 확인한다. 기본값이 조용히
      # 바뀌거나 `labels:`를 누군가 덮어쓰면 controller는 "발견할 릴리스가 없다"로
      # 읽고 배포가 조용히 멈춘다 — 그 실패는 호스트에서 진단하기 훨씬 어렵다.
      - name: revision 라벨 확인 (Release Ready 계약)
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          printf '%s\n' "$LABELS"
          revision=$(printf '%s\n' "$LABELS" | sed -n 's/^org\.opencontainers\.image\.revision=//p')
          # 모양부터 본다 — 라벨이 통째로 사라진 경우와 값이 어긋난 경우는 원인이 다르고,
          # 한 메시지로 뭉치면 호스트에서 진단할 때 헤맨다.
          if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision 라벨이 없거나 커밋 SHA 모양이 아니다(값='$revision')."
            echo "::error::호스트 controller가 이 라벨로 릴리스를 발견한다 — deploy/PLAN.md D2."
            exit 1
          fi
          # `metadata-action`은 **이벤트와 무관하게 `github.sha`를 적는다.** PR 실행에서
          # 그 값은 head 커밋이 아니라 머지 커밋이며, 그것이 이미지의 실제 내용이므로
          # 옳다. 이미지를 발행하지 않는 PR에서는 어차피 계약이 걸리지 않는다.
          if [[ $revision != "$GITHUB_SHA" ]]; then
            echo "::error::revision 라벨이 이 커밋과 다르다(값='$revision', 기대='$GITHUB_SHA')."
            exit 1
          fi
          echo "revision=$revision"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          # PR에서는 빌드만 한다(Dockerfile 회귀 검사).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestation 매니페스트를 붙이지 않는다 — 단일 플랫폼 이미지를
          # `docker pull`로만 쓰는 데 인덱스가 늘면 태그 다루기가 번거로워진다.
          provenance: false

      - name: 배포 방법 안내
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## 이미지 준비 완료"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/tag: /'
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "### 배포"
            echo
            echo "자동 배포 타이머가 켜져 있으면(\`yorr-auto-deploy.timer\`)"
            echo "**할 일이 없다** — 호스트가 5분마다 보고 진행 중인 게임이 없을 때 배포한다."
            echo "확인은 \`journalctl -u yorr-auto-deploy -f\`."
            echo
            echo "앞당기려면 **Actions → deploy → Run workflow**(태그 \`main\`)."
            echo "그 버튼은 기다리지 않으므로 **진행 중인 게임을 끊는다.**"
            echo "롤백은 같은 버튼에 \`sha-<커밋>\`을 넣는다."
            echo
            echo "러너가 죽었거나 타이머를 끈 상태라면 호스트에서:"
            echo
            echo '```bash'
            echo "~/yorr/deploy/deploy.sh"
            echo '```'
            echo
            echo "스크립트 없이 손으로 할 때:"
            echo
            echo '```bash'
            echo "cd ~/yorr && git pull      # deploy/compose.yaml은 이미지가 아니라 체크아웃에서 온다"
            echo "cd deploy"
            echo "docker compose pull backend"
            echo "docker compose up -d backend"
            echo "sleep 15 && docker compose ps && docker compose logs --tail 100 backend"
            echo '```'
            echo
            echo "> \`git pull\`을 빼먹으면 **새 이미지가 옛 설정으로 뜬다.**"
            echo "> 공개 주소(CORS 목록·콜백 세 개)의 정본이 \`deploy/compose.yaml\`이고,"
            echo "> 그 파일은 호스트의 git 체크아웃에서 읽힌다 — 이미지에는 들어 있지 않다."
            echo "> 실제로 주입되는 값은 \`docker compose config | grep CORS_\`로 확인한다."
            echo
            echo "> 워크플로가 직접 배포하지 않는 이유: 배포가 **진행 중 게임을 끊는다**."
            echo "> WS 구독과 라운드 마감 타이머가 프로세스 인메모리다(DESIGN.md 원칙 8)."
            echo "> 그래서 호스트가 당기고(게임이 없을 때만) GitHub은 밀지 않는다 —"
            echo "> 배포 키가 저장소에 없고 22번 포트도 열지 않는다(ADR-0006 §3 갱신 메모)."
          } >> "$GITHUB_STEP_SUMMARY"
