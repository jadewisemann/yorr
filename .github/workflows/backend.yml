# Node 백엔드 CI — backend/AGENTS.md 「검증 명령」과 같은 순서·같은 스크립트다.
#
# 저장소(방·세션·게임 상태)와 DB(SQLite)가 모두 프로세스 안에 있어(ADR-0007) 서비스
# 컨테이너도 바이너리 설치도 없다. 통합 테스트가 건너뛸 이유가 없으므로 전부 돈다.
# 배포물(번들)을 띄워 시험하고 `botkeep` 브랜치에 올리는 일은 botkeep.yml이 한다.

name: backend

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  workflow_dispatch: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json engines의 하한 줄 — node:sqlite가 플래그 없이 도는 최소선(22.13).
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      # 단위 + 통합 + 커버리지 래칫(vitest.config.ts).
      - run: npm run test:coverage
      # 블랙박스 프로토콜 스위트(TESTING.md) — 진짜 포트·진짜 소켓으로 한 판을 끝까지 두고,
      # 경계값·적대적 프레임·퍼저(400프레임)·저장소 장애 주입(4칸 간격)·누수 검사를 돈다.
      - run: npm run test:e2e
      - run: npm run build

      - name: 커버리지 요약
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e "
            const t = require('./coverage/coverage-summary.json').total
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |'
            console.log(['## 백엔드 커버리지', '', '| 지표 | 비율 | 덮음/전체 |', '|---|---|---|',
              ...['statements', 'branches', 'functions', 'lines'].map(row)].join('\n'))
          " >> "$GITHUB_STEP_SUMMARY"
