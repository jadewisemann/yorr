# Node 백엔드 CI + 배포 이미지 빌드 — backend/docs/adr/0006-github-actions-ghcr-arm64-single-host.md
#
# 검사와 이미지가 **한 파일 두 잡**인 이유: 테스트가 초록이 아닌 커밋의 이미지가
# GHCR에 올라가면 안 된다. 워크플로를 두 개로 나누면 `needs:`로 그것을 강제할 수
# 없다(`workflow_run`은 별개 실행이라 상태 전파가 느슨하다).
#
# PR에서도 image 잡이 돈다 — push만 하지 않는다. Dockerfile이 깨진 것을 배포
# 시점이 아니라 리뷰 시점에 알기 위해서다.

name: backend

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/backend.yml
  workflow_dispatch: {}

# 같은 브랜치의 이전 실행은 취소한다. 단 main은 취소하지 않는다 —
# 이미지 빌드가 중간에 잘리면 어떤 커밋이 배포 가능한지 알 수 없게 된다.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 1. 검사 ───────────────────────────────────────────────────────────────────
  verify:
    name: check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # MySQL 통합 테스트(45건)를 **처음으로 실제로 돌리는 자리다** — 지금까지
    # `MYSQL_TEST_URL`이 없어 전부 skip이었고 SQL 문법조차 검증된 적이 없다
    # (ADR-0005 / PLANS.md 상태 표). 여기서 처음 빨간불이 날 수 있다.
    #
    # 운영과 같은 8.0. 하네스는 테스트마다
    # `yorr_test_<random>` 스키마를 CREATE/DROP하므로 **root가 필요하다**
    # (backend/src/infra/__tests__/mysqlHarness.ts).
    services:
      mysql:
        image: mysql:8.0
        env:
          # 비밀번호를 두지 않는다. 이 인스턴스는 잡이 끝나면 사라지고 러너
          # 밖에서 닿을 수 없으므로 지킬 것이 없는데, 리터럴을 적으면 시크릿
          # 스캐너(GitGuardian)가 정당하게 잡는다 — "회전할 수 없는 가짜 자격"이
          # 저장소에 남는 것이 더 나쁘다.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
          --health-start-period=90s

    env:
      # ADR-0004 / ADR-0005: 통합 테스트가 "조용히 건너뛴 초록"이 되는 것을 막는
      # 스위치. 이 두 줄이 없으면 Redis·MySQL이 없는 러너에서 CI가 초록으로 거짓말한다.
      REDIS_TEST_REQUIRED: "1"
      MYSQL_TEST_URL: mysql://root@127.0.0.1:3306
      MYSQL_TEST_REQUIRED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # package.json engines: >=22.12
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ADR-0004의 기본 경로: 하네스가 **테스트 파일마다** redis-server를 유닉스
      # 소켓으로 띄운다. service container + REDIS_TEST_URL로 대신할 수도 있지만
      # 그러면 vitest의 병렬 파일들이 하나의 Redis에 FLUSHALL을 걸어 서로를 깬다.
      # 필요한 것은 데몬이 아니라 **바이너리**다.
      - name: redis-server 바이너리 설치 (ADR-0004)
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo timeout 120s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update
            sudo timeout 120s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::ForceIPv4=true \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends redis-server
          fi
          redis-server --version

      - run: npm ci

      # 아래는 backend/AGENTS.md 「검증 명령」과 같은 순서·같은 스크립트다.
      - run: npm run check
      - run: npm run typecheck
      # 단위 + 커버리지 래칫(vitest.config.ts). MySQL이 켜져 있으므로 CI용 바닥이 걸린다.
      - run: npm run test:coverage
      # 블랙박스 프로토콜 스위트(TESTING.md) — 진짜 포트·진짜 소켓으로 한 판을 끝까지 두고,
      # 경계값·적대적 프레임·퍼저(400프레임)·Redis 장애 주입(4칸 간격)·누수 검사를 돈다.
      - run: npm run test:e2e
      - run: npm run build

      - name: 커버리지 요약
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e "
            const t = require('./coverage/coverage-summary.json').total
            const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |'
            console.log(['## 백엔드 커버리지', '', '| 지표 | 비율 | 덮음/전체 |', '|---|---|---|',
              ...['statements', 'branches', 'functions', 'lines'].map(row)].join('\n'))
          " >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 배포 설정·controller 검증 ─────────────────────────────────────────────
  # `docker compose config`는 데몬 없이 돈다. 필수 변수(`${VAR:?}`)와 보간 오류를
  # 배포 직전이 아니라 여기서 잡는다.
  #
  # controller 검증이 같은 잡에 있는 이유: `image` 잡이 이 잡을 기다리므로(Release
  # Ready 계약) 배포 로직이 깨진 커밋의 이미지도 발행되지 않는다. 지난번 자동화는
  # **한 번도 실행되지 않은 채 머지됐다** — 호스트 없이 검증할 수 있는 것은 전부
  # 여기서 검증한다.
  compose:
    name: deploy 설정·controller 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 배포 스크립트 문법
        working-directory: deploy
        run: |
          for script in converge apply.sh status.sh rollback.sh bootstrap.sh metrics.sh tests/*.sh tests/fake-docker; do
            bash -n "$script"
            echo "ok $script"
          done

      # `bash -n`은 문법만 본다. 따옴표 빠진 변수 · 실패를 삼키는 `cd` · 항상 참인 비교처럼
      # **호스트에서만 드러나는** 결함은 shellcheck가 잡는다. 러너에 기본 설치되어 있다.
      # 경고 이상만 본다 — 스타일 제안(info/style)으로 배포를 막지 않는다.
      - name: shellcheck (배포 스크립트)
        working-directory: deploy
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning converge apply.sh status.sh rollback.sh bootstrap.sh metrics.sh tests/*.sh tests/fake-docker

      # 운영 Caddyfile은 호스트에서 처음 읽힌다 — 문법이 깨지면 caddy가 재시작 루프에 빠지고
      # 그동안 HTTPS 전체가 내려간다. 운영과 같은 이미지·같은 어댑터로 여기서 먼저 읽힌다.
      # (리허설은 인증서를 받을 수 없어 평문 Caddyfile로 바꿔 띄우므로 이 파일을 보지 않는다.)
      - name: Caddyfile 검증 (운영 · 리허설)
        working-directory: deploy
        run: |
          caddy_image=$(sed -n 's/^ *image: *\(caddy:[^ ]*\).*/\1/p' compose.yaml)
          echo "image=$caddy_image"
          for file in Caddyfile tests/rehearsal/Caddyfile; do
            docker run --rm -e PUBLIC_HOST=203.0.113.10 -e SERVER_PORT=8080 \
              -v "$PWD/$file:/etc/caddy/Caddyfile:ro" "$caddy_image" \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "ok $file"
          done

      # PLAN.md §9의 실패 주입 표. git은 진짜, docker만 대역이다 —
      # `up --wait` 실패 · 인프라 장애 · 게임 진행 · 잠금 경합을 실제로 주입한다.
      - name: controller 실패 주입 (deploy/PLAN.md §9)
        run: deploy/tests/converge.test.sh

      - name: compose config
        working-directory: deploy
        run: |
          # 실제 값이 아니라 자리만 채운다 — 검증하는 것은 문법과 필수 변수 목록이다.
          cat > ci.env <<'EOF'
          SERVER_PORT=8080
          DB_NAME=yorr
          DB_USERNAME=yorr
          DB_PASSWORD=ci
          MYSQL_ROOT_PASSWORD=ci
          PUBLIC_HOST=api.example.test
          EOF
          BACKEND_ENV_FILE=./ci.env docker compose --env-file ci.env config --quiet
          rm -f ci.env

      # 계측 설정은 문법이 깨져도 배포를 막지 않는다(별도 프로젝트다) — 대신 아무
      # 신호도 나가지 않는 상태로 **조용히** 멈춘다. 그래서 여기서 잡는다.
      # 운영자가 호스트에서 부르는 것과 **같은 명령**을 쓴다: 이 잡이 통과했다는 것이
      # `metrics.sh check`가 그 호스트에서도 통과한다는 뜻이어야 한다.
      - name: 계측 설정 검증 (Alloy)
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          PUBLIC_HOST=example.test
          SERVER_PORT=8080
          GRAFANA_CLOUD_PROM_URL=https://example.invalid/api/prom/push
          GRAFANA_CLOUD_PROM_USER=0
          GRAFANA_CLOUD_LOKI_URL=https://example.invalid/loki/api/v1/push
          GRAFANA_CLOUD_LOKI_USER=0
          GRAFANA_CLOUD_TOKEN=ci
          EOF
          ./metrics.sh check

          # 음성 대조. `alloy validate`는 통과할 때 아무것도 찍지 않으므로, 위
          # 명령이 성공한 것과 **검증기가 아무 일도 하지 않은 것**을 출력만으로는
          # 구별할 수 없다. 깨진 설정을 거절하는지 확인해 그 구별을 만든다 —
          # 하지 않으면 이 단계는 초록을 내는 연극이 된다.
          cp alloy/config.alloy /tmp/good.alloy
          printf 'prometheus.scrape "broken" {\n' > alloy/config.alloy
          if ./metrics.sh check >/dev/null 2>&1; then
            cp /tmp/good.alloy alloy/config.alloy
            echo "!! alloy validate가 깨진 설정도 통과시킨다 — 이 검증은 무의미하다." >&2
            exit 1
          fi
          cp /tmp/good.alloy alloy/config.alloy
          echo "-- 음성 대조 통과: 검증기가 깨진 설정을 거절한다"

          rm -f .env

  # ── 3. linux/arm64 이미지 (후보) ──────────────────────────────────────────────
  #
  # **GHCR `:main` = Release Ready.** 호스트는 별도의 manifest DB도 deployment server도
  # 보지 않고 `:main`이 가리키는 이미지를 배포 가능한 릴리스의 증거로 쓴다(deploy/PLAN.md
  # D2). 그래서 이 잡은 `:main`을 **붙이지 않는다** — 불변 태그 `sha-<커밋>`만 올리고,
  # 그 digest가 배포 리허설을 통과한 뒤에야 `promote` 잡이 `:main`을 옮긴다.
  #
  # `needs`가 `[verify, compose]`인 이유: verify 성공 + compose 실패 + 이미지 발행이
  # 성립하면 문법이 깨진 `compose.yaml`(호스트 체크아웃에서 읽히는 공개 주소·필수 변수의
  # 정본)을 가진 커밋이 "배포 가능"으로 표시된다.
  image:
    name: linux/arm64 이미지
    needs: [verify, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # 리허설이 받을 참조. main은 GHCR의 digest, PR은 아티팩트로 넘긴 로컬 태그다.
      ref: ${{ steps.candidate.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 러너는 x86이고 대상은 arm64다. **빌드에 ARM 러너를 쓰지 않는 이유**(ADR-0006):
      # Dockerfile이 컴파일·의존성 설치를 전부 `--platform=$BUILDPLATFORM`에서 끝내고
      # arm64 스테이지에는 `RUN`이 없어 에뮬레이션 비용이 0이다. (리허설은 ARM 러너에서
      # **실행**한다 — 호스트와 같은 아키텍처에서 떠 봐야 하기 때문이다.)
      #
      # QEMU를 그래도 설치하는 것은 보험이다 — 누군가 런타임 스테이지에 `RUN`을
      # 넣었을 때 "exec format error"라는 알기 어려운 실패 대신 그냥 느리게 성공한다.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 별도 PAT가 필요 없다 — 이 워크플로의 packages:write 권한으로 충분하다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-backend
          # 불변 태그만 붙인다. `main`(발견용)은 리허설을 통과한 뒤 `promote`가 옮긴다.
          # 호스트는 `:main`으로 발견하고 **digest로 고정해 실행한다**(deploy/PLAN.md D3).
          tags: |
            type=sha,prefix=sha-,format=short

      # `metadata-action`의 기본 라벨에 `org.opencontainers.image.revision`이 있다.
      # 호스트 controller의 릴리스 발견이 **그 라벨 하나**에 달려 있으므로(이미지가
      # 곧 release marker다 — D2) 여기서 실제로 붙었는지 확인한다. 기본값이 조용히
      # 바뀌거나 `labels:`를 누군가 덮어쓰면 controller는 "발견할 릴리스가 없다"로
      # 읽고 배포가 조용히 멈춘다 — 그 실패는 호스트에서 진단하기 훨씬 어렵다.
      - name: revision 라벨 확인 (Release Ready 계약)
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          printf '%s\n' "$LABELS"
          revision=$(printf '%s\n' "$LABELS" | sed -n 's/^org\.opencontainers\.image\.revision=//p')
          # 모양부터 본다 — 라벨이 통째로 사라진 경우와 값이 어긋난 경우는 원인이 다르고,
          # 한 메시지로 뭉치면 호스트에서 진단할 때 헤맨다.
          if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision 라벨이 없거나 커밋 SHA 모양이 아니다(값='$revision')."
            echo "::error::호스트 controller가 이 라벨로 릴리스를 발견한다 — deploy/PLAN.md D2."
            exit 1
          fi
          # `metadata-action`은 **이벤트와 무관하게 `github.sha`를 적는다.** PR 실행에서
          # 그 값은 head 커밋이 아니라 머지 커밋이며, 그것이 이미지의 실제 내용이므로 옳다.
          if [[ $revision != "$GITHUB_SHA" ]]; then
            echo "::error::revision 라벨이 이 커밋과 다르다(값='$revision', 기대='$GITHUB_SHA')."
            exit 1
          fi
          echo "revision=$revision"

      # PR: 발행하지 않고 이미지를 파일로 떠서 리허설 잡에 넘긴다.
      - name: 빌드 (PR — 아티팩트로)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/backend-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # main: `sha-<커밋>`만 발행한다. 리허설은 이 digest를 그대로 당겨 시험한다.
      - id: push
        name: 빌드·발행 (main — sha 태그만)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestation 매니페스트를 붙이지 않는다 — 단일 플랫폼 이미지를
          # `docker pull`로만 쓰는 데 인덱스가 늘면 태그 다루기가 번거로워진다.
          provenance: false

      - id: candidate
        name: 리허설에 넘길 참조
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ -n $DIGEST ]]; then
            echo "ref=ghcr.io/${GITHUB_REPOSITORY}-backend@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(printf '%s\n' "$TAGS" | head -n1)" >> "$GITHUB_OUTPUT"
          fi

      - name: 이미지 아티팩트 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          retention-days: 1
          compression-level: 0

  # ── 4. 배포 리허설 — 호스트와 같은 arm64에서, 호스트가 받을 바로 그 이미지로 ────────
  #
  # SQLite의 "test what you fly"다. 소스가 아니라 출하물을 시험한다: 운영과 같은
  # compose·같은 `apply.sh`(up -d --wait)로 스택 전체를 띄우고, Caddy 너머에서 블랙박스
  # 스위트를 돌리고, 재시작 뒤에도 healthy인지 보고, 컨테이너별 메모리·CPU를 잰다.
  # 여기서 떨어진 이미지는 `:main`이 되지 않으므로 호스트에 닿지 않는다.
  rehearsal:
    name: 배포 리허설 (arm64 · compose · Caddy)
    needs: [image]
    # 공개 저장소라 ARM 러너가 무료다(ADR-0006 갱신 메모).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 블랙박스 스위트를 돌릴 도구(vitest·ws)만 필요하다. 서버는 컨테이너 안에 있다.
      - name: 블랙박스 스위트 준비
        working-directory: backend
        run: npm ci

      - name: 후보 이미지 받기 (PR — 아티팩트)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: 후보 이미지 적재 (PR)
        if: github.event_name == 'pull_request'
        run: docker load -i "$RUNNER_TEMP/backend-image.tar"

      - name: GHCR 로그인 (main)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 후보 이미지 받기 (main — 발행된 digest 그대로)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ needs.image.outputs.ref }}
        run: docker pull "$REF"

      - name: 리허설
        env:
          REF: ${{ needs.image.outputs.ref }}
          REHEARSAL_WORK: ${{ runner.temp }}/rehearsal
          REHEARSAL_REPORT: ${{ runner.temp }}/rehearsal/report.md
        run: |
          mkdir -p "$REHEARSAL_WORK"
          deploy/tests/rehearsal.sh "$REF"
          cat "$REHEARSAL_REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 자료
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal
          path: ${{ runner.temp }}/rehearsal
          retention-days: 7

  # ── 5. `:main` 승격 — 리허설을 통과한 digest에만 ──────────────────────────────────
  #
  # 새로 빌드하지 않는다. 리허설이 시험한 **바로 그 매니페스트**에 태그만 붙인다
  # (`--prefer-index=false` = 인덱스를 새로 만들지 않고 그대로 복사). 그래야 `:main`의
  # digest가 리허설한 digest와 같다 — 아래에서 확인한다.
  promote:
    name: ":main 승격 (Release Ready)"
    needs: [image, rehearsal]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ":main을 리허설한 digest로"
        env:
          REF: ${{ needs.image.outputs.ref }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY}-backend"
          docker buildx imagetools create --prefer-index=false -t "$repo:main" "$REF"
          promoted=$(docker buildx imagetools inspect "$repo:main" --format '{{json .Manifest}}' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          if [[ $promoted != "$DIGEST" ]]; then
            echo "::error::승격한 :main($promoted)이 리허설한 digest($DIGEST)와 다르다."
            exit 1
          fi
          echo "main → $promoted"

      - name: 배포 안내
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          {
            echo "## Release Ready — \`:main\` = \`${DIGEST}\`"
            echo
            echo "리허설을 통과한 digest다. **할 일이 없다** — 호스트의 \`yorr-converge\` 타이머가"
            echo "5분마다 \`:main\`을 보고, 게임 중인 사람이 없을 때 revision과 digest를 함께 배포한다."
            echo "150초 안에 healthy가 되지 않으면 직전 릴리스로 되돌리고 자동 배포를 멈춘다(HALT)."
            echo
            echo '```bash'
            echo "/usr/local/lib/yorr-deploy/converge --dry-run   # 판단만"
            echo "/usr/local/lib/yorr-deploy/converge             # 지금 한 번"
            echo "deploy/status.sh                                # 무엇이 돌고 있는지"
            echo "/usr/local/lib/yorr-deploy/converge rollback    # 직전 릴리스로 + HALT"
            echo "/usr/local/lib/yorr-deploy/converge resume      # HALT 풀기"
            echo '```'
            echo
            echo "절차 전체는 backend/docs/design/operations.md 「배포 (새 controller)」."
          } >> "$GITHUB_STEP_SUMMARY"
