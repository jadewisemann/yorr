# 야간 심층 테스트 — PR에서는 짧게 도는 것을 길게 돈다(TESTING.md).
#
# - 프로토콜 퍼저: 매번 새 시드로 2만 프레임. 시드는 요약에 남긴다 — 실패하면 그 시드를
#   `FUZZ_SEED`로 주고 로컬에서 같은 프레임을 같은 순서로 다시 돌린다.
# - 저장소 장애 주입: 여정의 **모든** 명령 위치에서(PR은 4칸 간격).
#
# 운영에 닿지 않는다 — 서버는 이 러너 안에서 뜨고 사라진다.
name: nightly

on:
  schedule:
    # 03:17 KST. 정각을 피한다(GitHub 스케줄러가 정각에 몰린다).
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seed:
        description: "퍼저 시드 (비우면 새로 뽑는다)"
        required: false
        default: ""
      fuzz_iterations:
        description: "퍼저 프레임 수"
        required: false
        default: "20000"

permissions:
  contents: read

jobs:
  deep:
    name: 퍼저 · 장애 주입 전수
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANOMALY_STRIDE: "1"
      FUZZ_ITERATIONS: ${{ inputs.fuzz_iterations || '20000' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: 시드 정하기
        env:
          REQUESTED_SEED: ${{ inputs.fuzz_seed }}
        run: |
          seed="${REQUESTED_SEED:-$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')}"
          echo "FUZZ_SEED=$seed" >> "$GITHUB_ENV"
          {
            echo "## 야간 심층 테스트"
            echo
            echo "- 퍼저 시드: \`$seed\` · 프레임 ${FUZZ_ITERATIONS}개"
            echo "- 재현: \`FUZZ_SEED=$seed FUZZ_ITERATIONS=${FUZZ_ITERATIONS} npm run test:e2e -- robustness\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm run test:e2e

      # 봇 AI 심층 — PR보다 많은 판·전 구간 스윕(src/game/yacht/bot/__tests__).
      - name: 봇 정책 오라클 대조 · 장애 주입 전수 · 대량 시뮬레이션
        env:
          BOT_ORACLE_SEED: ${{ env.FUZZ_SEED }}
          BOT_ORACLE_BOARDS: "60"
          BOT_ORACLE_DEEP_BOARDS: "18"
          BOT_FUZZ_SEED: ${{ env.FUZZ_SEED }}
          BOT_FUZZ_ITERATIONS: "3000"
          BOT_SWEEP_STRIDE: "1"
          BOT_SIM_SEED: ${{ env.FUZZ_SEED }}
          BOT_SIM_GAMES: "300"
        run: npx vitest run src/game/yacht/bot

      # 봇 부하 아래의 응답성 — 방 30개 × 봇 5명이 도는 동안 무관한 소켓의 ping 왕복을 잰다.
      - name: 봇 부하 응답성
        # 앞선 심층 테스트가 실패해도 진단(p99·굴림 수)은 남긴다 — 기본 조건은 success()다.
        if: ${{ !cancelled() }}
        env:
          LOAD_ROOMS: "30"
          LOAD_SECONDS: "60"
        # shell을 지정하지 않으면 Actions는 pipefail 없는 `bash -e`로 돈다 — 그러면 테스트가 실패해도
        # 파이프 끝의 tee가 0을 내 단계가 초록이 된다. 요약은 실패해도 남기고, 종료 코드는 테스트의 것이다.
        shell: bash
        run: |
          set +e
          npm run test:load 2>&1 | tee load.log
          status=${PIPESTATUS[0]}
          grep '\[bot-load\]' load.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: 부하 로그 업로드
        # 리포트 줄이 없을 때 실패 원인을 볼 수 있게 항상 올린다.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-load-log
          path: backend/load.log
          if-no-files-found: ignore
