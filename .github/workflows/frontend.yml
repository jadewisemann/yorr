# 프론트 CI — frontend/AGENTS.md 「검증 명령」을 그대로 돌린다.
#
# 왜 이 파일이 필요한가: 프론트 배포는 Vercel이 직접 한다(`npm run build`). 그
# 빌드는 **타입 오류와 테스트 실패를 막지 않는다** — `tsc -b`가 걸러 주는 것까지가
# 전부이고, biome·vitest는 거기서 돌지 않는다. 그리고 Vercel은 병합 즉시 배포하므로
# 백엔드처럼 health 게이트가 없다 — **여기가 프론트의 유일한 관문이다.**
#
# Playwright mock E2E도 여기서 돈다. 한동안 CI 밖에 있었고, 그사이 17개가 조용히
# 상했다(그중 하나는 320px에서 턴 표시가 사라진 진짜 회귀였다 — 2026-09-30). 비주얼
# 대조(playwright.visual.config.ts)는 baseline을 저장소에 두지 않는 도구라 CI가 지킬
# 대상이 아니다. 실제 백엔드와 붙여 보는 E2E는 fullstack.yml이다.

name: frontend

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch: {}

# 같은 브랜치의 이전 실행은 취소한다(backend.yml과 같은 규칙). main을 취소하지
# 않는 이유는 이 워크플로에는 없다 — 산출물을 올리지 않으므로 관례를 맞추기만 한다.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: check · typecheck · test · build · cycles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 백엔드 잡과 같은 메이저로 맞춘다(backend package.json engines: >=22.12).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 순서·스크립트는 frontend/AGENTS.md 「검증 명령」과 같다.
      - run: npm run check
      - run: npm run typecheck
      # 단위·컴포넌트 + 커버리지 래칫(vitest.config.ts의 thresholds).
      - run: npm run test:coverage
      # 프로덕션 빌드. vite.config.ts의 `assertSecureEndpoint`도 여기서 돈다 —
      # env가 없으면 상대경로 기본값이라 통과한다(운영 값은 Vercel이 준다).
      - run: npm run build
      - run: npm run check:cycles

  e2e-mock:
    name: Playwright mock E2E (chromium · webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 네 프로젝트가 두 엔진을 쓴다: Pixel 7 · 320px · 데스크톱(chromium), iPhone 15(webkit).
      - run: npx playwright install --with-deps chromium webkit

      # 빌드 산출물(dist)을 preview 서버로 띄워 REST·WS를 페이지 안에서 가짜로 받는다.
      - run: npm run test:e2e

      - name: 실패 보고서
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-mock
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
