<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- --ds-color-canvas와 같은 값. 다르면 모바일 주소창만 다른 색으로 떠 화면이 잘려 보인다.
         테마를 바꾸면 styles/theme.ts의 applyTheme가 이 content를 같이 갈아준다. -->
    <meta name="theme-color" content="#08090a" />
    <!--
      프리페인트 테마 적용. 번들이 실행되기 **전에** 돌아야 한다 — React에서 적용하면
      라이트를 고른 사용자가 흰 화면 직전에 검은 깜빡임을 본다.
      계약은 tokens.css와 같다: :root가 다크, [data-theme="light"]가 오버라이드.
      저장 키·값은 styles/theme.ts와 짝이다(한쪽만 고치지 않는다).
    -->
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('yorr.theme')
          const pref = saved === 'dark' || saved === 'light' || saved === 'system' ? saved : 'system'
          const light =
            pref === 'light' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          if (!light) return
          document.documentElement.setAttribute('data-theme', 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ebebe8')
        } catch {
          // localStorage가 막힌 환경(프라이빗 모드 등)은 기본 테마인 다크로 둔다.
        }
      })()
    </script>
    <meta name="description" content="흔들어서 즐기는 실시간 요트다이스, YORR" />
    <link rel="icon" type="image/svg+xml" href="/mascot-favicon.svg" />
    <title>YORR</title>
    <!--
      링크를 붙여넣는 곳(카카오톡·디스코드·슬랙)에서 뜨는 미리보기. 초대 코드를 채팅으로
      주고받는 서비스라 이게 사실상 첫 화면이다.
      og:image는 아직 없다 — 크롤러 대부분이 SVG를 렌더하지 않아 mascot-favicon.svg로는
      카드가 채워지지 않는다. 1200x630 PNG가 생기면 여기에 og:image·twitter:card=
      summary_large_image로 올린다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YORR" />
    <meta property="og:title" content="YORR — 흔들어서 즐기는 실시간 요트다이스" />
    <meta property="og:description" content="폰을 주사위 삼아 흔든다. 코드 하나로 바로 합류." />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="YORR — 흔들어서 즐기는 실시간 요트다이스" />
    <meta name="twitter:description" content="폰을 주사위 삼아 흔든다. 코드 하나로 바로 합류." />
  </head>
  <body>
    <!--
      JS를 받아 React가 뜨기 전까지 #root는 비어 있다 — 느린 회선에서 그 구간이 통째로
      검은 화면이다. 여기 스플래시를 인라인으로 두면 HTML 한 장만으로 즉시 칠해지고
      (추가 요청 0), main.tsx가 첫 렌더를 끝낸 뒤 지운다.
      스타일도 인라인이다. 외부 CSS를 기다리면 스플래시 자체가 늦게 뜬다.
    -->
    <div id="root">
      <div
        id="boot-splash"
        role="status"
        aria-label="불러오는 중"
        style="
          display: grid;
          place-items: center;
          gap: 18px;
          width: 100%;
          height: 100svh;
          background: #08090a;
          color: #f7f7f5;
          font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        "
      >
        <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em">
          YO<span style="color: #e53935">R</span>R
        </span>
        <span
          style="
            width: 28px;
            height: 28px;
            border: 2px solid rgb(255 255 255 / 25%);
            border-top-color: #f7f7f5;
            border-radius: 50%;
            animation: boot-spin 700ms linear infinite;
          "
        ></span>
      </div>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* 모션 감소 설정에서는 돌리지 않는다 — 워드마크만 남긴다. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash span:last-child {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
