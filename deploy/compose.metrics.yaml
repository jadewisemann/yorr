# YORR 계측 — Grafana Cloud로 보내는 수집 에이전트 하나.
#
# ── 왜 별도 파일이자 별도 프로젝트인가 ────────────────────────────────────────
# `apply.sh`는 **서비스를 지정하지 않고** `docker compose up -d --wait`를 부른다
# (D7 — 같은 릴리스에 들어온 redis·caddy 설정 변경까지 적용해야 하므로 의도한
# 것이다). 그래서 이 컨테이너를 `compose.yaml`에 넣으면 다음이 성립한다:
#
#     Alloy 설정 오타 → 재시작 루프 → `--wait` 실패 → **정상 릴리스가 롤백된다**
#
# 모니터링이 감시 대상을 깨뜨리는 경로다. 별도 프로젝트로 두면 배포의 `up -d`가
# 이 컨테이너를 아예 보지 않으므로 그 경로가 **구조적으로** 없어진다. 대신 이쪽은
# 배포와 함께 갱신되지 않는다 — 설정을 바꾼 뒤에는 `deploy/metrics.sh up`을 다시
# 부른다. 그 비용을 받아들인 것이다.
#
# 그리고 여기서는 필수 변수를 `${VAR:?}`로 걸어도 안전하다. 이 파일은 배포 경로의
# `docker compose config`에 걸리지 않으므로, 값이 비면 **배포가 아니라 이 명령이**
# 실패한다.
#
#   deploy/metrics.sh up       # 띄우기 · 설정 변경 반영
#   deploy/metrics.sh logs     # 수집이 되고 있나
#   deploy/metrics.sh down     # 내리기

name: ${YORR_STACK_PROJECT:-yorr}-metrics

services:
  alloy:
    # ⚠️ 태그가 `latest`다. 이 저장소는 인프라 이미지를 digest로 고정하는 방향이고
    #    (PLAN.md PR 5) 이것도 그 대상이다. 지금 고정하지 않은 이유는 실제로 뜨는
    #    버전을 확인하기 전에 존재하지 않는 태그를 박으면 첫 기동이 실패하기
    #    때문이다. 뜬 뒤 `deploy/metrics.sh pin`이 알려 주는 digest로 고정한다.
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    container_name: ${ALLOY_CONTAINER:-yorr-alloy}
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      # UI를 공개하지 않는다. 포트를 열지 않으므로 호스트 밖에서 닿을 길이 없고,
      # 컨테이너 안에서 디버깅할 때만 쓴다.
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy

    environment:
      # Grafana Cloud의 Prometheus·Loki는 **엔드포인트와 사용자 ID가 서로 다르다.**
      # 토큰은 보통 같은 것을 쓴다(둘 다 write 권한이 있는 것).
      GC_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:?deploy/.env에 GRAFANA_CLOUD_PROM_URL이 필요하다 — Grafana Cloud > Prometheus > Remote Write Endpoint}
      GC_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:?deploy/.env에 GRAFANA_CLOUD_PROM_USER가 필요하다 — Prometheus의 Username / Instance ID}
      GC_PROM_TOKEN: ${GRAFANA_CLOUD_TOKEN:?deploy/.env에 GRAFANA_CLOUD_TOKEN이 필요하다 — Access Policy 토큰}
      GC_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?deploy/.env에 GRAFANA_CLOUD_LOKI_URL이 필요하다 — Loki > Push URL}
      GC_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?deploy/.env에 GRAFANA_CLOUD_LOKI_USER가 필요하다 — Loki의 User}
      GC_LOKI_TOKEN: ${GRAFANA_CLOUD_TOKEN:?}
      # backend는 포트를 공개하지 않으므로 컨테이너 이름으로만 닿는다. caddy가
      # 쓰는 것과 같은 주소다.
      GC_BACKEND_TARGET: backend:${SERVER_PORT:-8080}
      # journald의 저널 위치. 영속이면 /var/log/journal, 휘발성이면 /run/log/journal이고
      # 한쪽만 존재한다. `metrics.sh`가 실제로 있는 쪽을 골라 넘긴다 — 한 경로를 박으면
      # 모니터링이 호스트의 journald 설정에 의존한다.
      GC_JOURNAL_PATH: ${YORR_JOURNAL_PATH:-/rootfs/var/log/journal}

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # 호스트의 /proc·/sys와 journal을 읽는다. **읽기 전용이고 docker 소켓은
      # 마운트하지 않는다** — 소켓은 사실상 root 권한이고, 그 경계를 넘으면
      # 컨테이너별 사용량을 얻는 대신 §11의 보안 경계를 스스로 지운다.
      - /:/rootfs:ro,rslave
      # `converge`가 자기 판단을 .prom으로 남기는 곳. 이것이 자동화 데드맨의 근거다.
      - ${YORR_STATE_DIR:-/var/lib/yorr-deploy}/metrics:/textfile:ro

    networks:
      # backend를 긁으려면 그 네트워크에 붙어야 한다. `internal`이 아니라 `edge`를
      # 고른 것은 의도다 — MySQL·Redis에 직접 닿을 필요가 없다.
      edge: {}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 배포 스택이 만든 네트워크를 **빌려 쓴다**(만들지 않는다). 이 프로젝트를 내려도
  # 배포 스택의 네트워크는 남는다.
  edge:
    external: true
    # 배포 스택이 만든 네트워크의 실제 이름이다(`<프로젝트>_edge`). `COMPOSE_PROJECT_NAME`을
    # 쓰지 않는 것은 의도다 — 그 변수는 compose가 이 파일의 `name:`을 읽은 뒤 스스로
    # 채우기도 해서, 여기서 참조하면 `yorr-metrics_edge`로 해석될 수 있다.
    name: ${YORR_STACK_PROJECT:-yorr}_edge

volumes:
  # WAL — remote_write가 일시적으로 실패해도 여기 쌓아 두고 나중에 보낸다.
  alloy-data: {}
